[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vector_tile_base"
version = "1.0.2"
description = "Python implementation of Mapbox vector tiles"
readme = "README.md"
license = "BSD-3-Clause"
authors = [
    {name = "Sean Gillies", email = "sean@mapbox.com"}
]
keywords = ["vector", "tiles", "mapbox", "protobuf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: GIS",
]
requires-python = ">=3.9"
dependencies = [
    "protobuf>=3.20.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools]
packages = ["vector_tile_base"]

[tool.setuptools.package-data]
vector_tile_base = ["*.proto"] 